receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/redact:
    actions:
      - key: url.full
        action: delete
      - key: url.path
        action: delete
      - key: url.query
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: user_agent.original
        action: delete
      - key: enduser.id
        action: delete
      - key: db.query.text
        action: delete
      - key: db.statement
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete
  batch:

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp/tempo]
