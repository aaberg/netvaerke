product: jvm/lib

dependencies:
  - org.jetbrains.kotlin:kotlin-reflect:2.4.20
  - io.nats:jnats:2.26.3
  - io.opentelemetry:opentelemetry-api:1.66.0
  - io.opentelemetry:opentelemetry-extension-kotlin:1.66.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0
  # Kotlin's transitive annotations artifact is 13.0, which does not include
  # UnknownNullability needed when the IDE analyses JSpecify-annotated JNATS APIs.
  - org.jetbrains:annotations:26.1.0

test-dependencies:
  - ../test-support
  - io.opentelemetry:opentelemetry-sdk:1.66.0
  - io.opentelemetry:opentelemetry-sdk-testing:1.66.0

settings:
  kotlin:
    version: 2.4.20
    allWarningsAsErrors: true
    serialization:
      format: json
