services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netvaerke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc123}
      POSTGRES_DB: ${POSTGRES_DB:-netvaerke}
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-netvaerke} -d ${POSTGRES_DB:-netvaerke}
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - default
    volumes:
      - db_data:/var/lib/postgresql

  liquibase:
    build:
      context: ./liquibase
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-netvaerke}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-netvaerke}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-abc123}
    networks:
      - default

  nats:
    image: nats:2.15.0-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.local.yaml:/etc/tempo/tempo.yaml:ro,z

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - tempo
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/otel-collector.local.yaml:/etc/otelcol-contrib/config.yaml:ro,z

  grafana:
    image: grafana/grafana:13.2.2
    depends_on:
      - tempo
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z

# hanko services
  postgres_hanko:
    image: postgres:18-alpine
#    ports:
#      - "5433:5432"
    environment:
      - POSTGRES_USER=hanko
      - POSTGRES_PASSWORD=hanko
      - POSTGRES_DB=hanko
    healthcheck:
      test: pg_isready -U hanko -d hanko
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default
    volumes:
      - hanko_data:/var/lib/postgresql

  hanko-migrate:
    image: ghcr.io/teamhanko/hanko:v3.0.4
    depends_on:
      postgres_hanko:
        condition: service_healthy
    volumes:
      - ./hanko-config.yaml:/etc/hanko/config.yaml:ro,z
    command: --config /etc/hanko/config.yaml migrate up

  hanko:
    image: ghcr.io/teamhanko/hanko:v3.0.4
    depends_on:
      hanko-migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"  # Public API
      - "8001:8001"  # Admin API
    volumes:
      - ./hanko-config.yaml:/etc/hanko/config.yaml:ro,z
    command: serve --config /etc/hanko/config.yaml all

  mailslurper:
    image: marcopas/docker-mailslurper:latest
    ports:
      - '8090:8080' # web UI
      - '8085:8085'
    networks:
      - default

  ## Garage
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    restart: unless-stopped
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin / Metrics
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=GK698c7adae13cc6e850406633
      - GARAGE_DEFAULT_SECRET_KEY=a3ce92455d1cd0883a6832b5e1d4e23be4c639aa8979a415968989144094fbc9
      - GARAGE_DEFAULT_BUCKET=my-bucket
    command: [ "/garage", "server", "--single-node", "--default-bucket" ]
    volumes:
      # Note the :ro,Z and :Z flags below
      - ./garage.toml:/etc/garage.toml:ro,Z
      - garage-meta:/var/lib/garage/meta:Z
      - garage-data:/var/lib/garage/data:Z

networks:
  default:
    name: netvaerke

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME:-netvaerke}_db_data_v18
  hanko_data:
    name: ${COMPOSE_PROJECT_NAME:-netvaerke}_hanko_data_v18
  garage-meta:
  garage-data:
