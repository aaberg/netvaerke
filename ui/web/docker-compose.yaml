include:
  - ../../docker-compose.yaml

services:
  web:
    build:
      context: ../..
      dockerfile: ui/web/Dockerfile
    restart: unless-stopped
    depends_on:
      membership-manager:
        condition: service_started
      hanko:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      NATS_URL: nats://nats:4222
      MEMBERSHIP_NATS_SUBJECT: ${MEMBERSHIP_NATS_SUBJECT:-netvaerke.membership-manager.v1}
      MEMBERSHIP_NATS_TIMEOUT_SECONDS: ${MEMBERSHIP_NATS_TIMEOUT_SECONDS:-5}
      NETWORK_MANAGER_NATS_SUBJECT: ${NETWORK_MANAGER_NATS_SUBJECT:-netvaerke.network-manager.v1}
      NETWORK_MANAGER_NATS_TIMEOUT_SECONDS: ${NETWORK_MANAGER_NATS_TIMEOUT_SECONDS:-5}
      HANKO_API_URL: ${HANKO_API_URL:-http://localhost:8000}
      HANKO_VALIDATION_API_URL: http://hanko:8000
      HANKO_COOKIE_DOMAIN: ${HANKO_COOKIE_DOMAIN:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      FILE_STORAGE_ENDPOINT: http://garage:3900
      FILE_STORAGE_PUBLIC_ENDPOINT: ${FILE_STORAGE_PUBLIC_ENDPOINT:-http://localhost:3900}
      FILE_STORAGE_REGION: garage
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-my-bucket}
      FILE_STORAGE_ACCESS_KEY: ${FILE_STORAGE_ACCESS_KEY:-GK698c7adae13cc6e850406633}
      FILE_STORAGE_SECRET_KEY: ${FILE_STORAGE_SECRET_KEY:-a3ce92455d1cd0883a6832b5e1d4e23be4c639aa8979a415968989144094fbc9}
      OTEL_SERVICE_NAME: netvaerke-web
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=netvaerke,deployment.environment.name=local,service.version=${OTEL_SERVICE_VERSION:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_SAMPLER: always_on
      OTEL_PROPAGATORS: tracecontext,baggage

  membership-manager:
    build:
      context: ../..
      dockerfile: businesslogic/membership-manager/Dockerfile
    restart: unless-stopped
    depends_on:
      liquibase:
        condition: service_completed_successfully
      nats:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-netvaerke}
      DATABASE_USER: ${POSTGRES_USER:-netvaerke}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-abc123}
      NATS_URL: nats://nats:4222
      MEMBERSHIP_NATS_SUBJECT: ${MEMBERSHIP_NATS_SUBJECT:-netvaerke.membership-manager.v1}
      MEMBERSHIP_NATS_QUEUE_GROUP: ${MEMBERSHIP_NATS_QUEUE_GROUP:-netvaerke.membership-manager.v1}
      MEMBERSHIP_NATS_TIMEOUT_SECONDS: ${MEMBERSHIP_NATS_TIMEOUT_SECONDS:-5}
      OTEL_SERVICE_NAME: netvaerke-membership-manager
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=netvaerke,deployment.environment.name=local,service.version=${OTEL_SERVICE_VERSION:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_SAMPLER: always_on
      OTEL_PROPAGATORS: tracecontext,baggage

  network-manager:
    build:
      context: ../..
      dockerfile: businesslogic/network-manager-application/Dockerfile
    restart: unless-stopped
    depends_on:
      liquibase:
        condition: service_completed_successfully
      nats:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-netvaerke}
      DATABASE_USER: ${POSTGRES_USER:-netvaerke}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-abc123}
      NATS_URL: nats://nats:4222
      NETWORK_MANAGER_NATS_SUBJECT: ${NETWORK_MANAGER_NATS_SUBJECT:-netvaerke.network-manager.v1}
      NETWORK_MANAGER_NATS_QUEUE_GROUP: ${NETWORK_MANAGER_NATS_QUEUE_GROUP:-netvaerke.network-manager.v1}
      NETWORK_MANAGER_NATS_TIMEOUT_SECONDS: ${NETWORK_MANAGER_NATS_TIMEOUT_SECONDS:-5}
      OTEL_SERVICE_NAME: netvaerke-network-manager
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=netvaerke,deployment.environment.name=local,service.version=${OTEL_SERVICE_VERSION:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_SAMPLER: always_on
      OTEL_PROPAGATORS: tracecontext,baggage
